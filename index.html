<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Central do Casamento</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FDF8EE;
    --cream-dark: #F5EDD8;
    --gold: #B8974A;
    --gold-light: #D4AF6B;
    --olive: #4A5240;
    --olive-light: #6B7560;
    --olive-dark: #2E3328;
    --text: #3A3228;
    --text-light: #6B5E4A;
    --white: #FFFFFF;
    --shadow: rgba(74,82,64,0.10);
    --shadow-md: rgba(74,82,64,0.16);
    --alert-bg: #FFF8ED;
    --alert-border: #D4AF6B;
    --danger-bg: #FFF2F2;
    --danger-border: #C9847A;
    --tip-bg: #F2F6EE;
    --tip-border: #6B7560;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Jost', sans-serif;
    background: var(--cream);
    color: var(--text);
    font-weight: 300;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== PRINT PROTECTION ===== */
  @media print { body { display: none !important; } }

  /* ===== LOGIN SCREEN ===== */
  #login-screen {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--cream);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    min-height: 100vh;
  }

  .login-bg-deco {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  }

  .login-card {
    position: relative; z-index: 2;
    background: transparent;
    border: 1px solid rgba(184,151,74,0.25);
    border-radius: 3px;
    padding: 52px 44px;
    width: 100%; max-width: 420px;
    box-shadow: 0 8px 60px rgba(74,82,64,0.10);
    text-align: center;
  }

  .login-logo {
    width: 220px; margin: 0 auto 32px;
    display: transparent;
    mix-blend-mode: multiply;
  }

  .login-card h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-weight: 400;
    color: var(--olive-light);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }

  .login-input {
    width: 100%;
    padding: 13px 18px;
    border: 1px solid rgba(184,151,74,0.35);
    border-radius: 2px;
    background: var(--cream);
    font-family: 'Jost', sans-serif;
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--text);
    margin-bottom: 14px;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 0.04em;
  }
  .login-input:focus { border-color: var(--gold); }
  .login-input::placeholder { color: #bbb; }

  .login-btn {
    width: 100%;
    padding: 14px;
    background: var(--olive);
    color: white;
    border: none;
    border-radius: 2px;
    font-family: 'Jost', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-bottom: 18px;
  }
  .login-btn:hover { background: var(--olive-dark); }
  .login-btn:active { transform: scale(0.99); }

  .login-error {
    color: #b94444; font-size: 0.82rem; margin-bottom: 10px;
    min-height: 18px; letter-spacing: 0.02em;
  }

  .login-register {
    margin-top: 6px;
    font-size: 0.78rem;
    color: var(--text-light);
    letter-spacing: 0.06em;
  }
  .login-register a {
    color: var(--gold);
    text-decoration: none;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-size: 0.76rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .login-register a:hover { border-color: var(--gold); }

  /* ===== MAIN APP ===== */
  #app { display: none; }

  /* ===== HERO ===== */
  .hero {
    background: var(--cream);
    position: relative;
    overflow: hidden;
    padding: 56px 24px 48px;
    text-align: center;
    border-bottom: 1px solid rgba(184,151,74,0.2);
  }

  .hero-deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  .hero-logo {
    position: relative; z-index: 2;
    width: 260px; max-width: 70vw;
    margin: 0 auto 20px;
    display: block;
    mix-blend-mode: multiply;
  }

  .hero-tagline {
    position: relative; z-index: 2;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    font-weight: 300;
    font-style: italic;
    color: var(--olive-light);
    letter-spacing: 0.08em;
  }

  /* ===== LOGOUT ===== */
  .top-bar {
    background: var(--olive-dark);
    padding: 10px 24px;
    display: flex; align-items: center; justify-content: flex-end;
    gap: 16px;
  }
  .logout-btn {
    background: none; border: 1px solid rgba(255,255,255,0.25);
    color: rgba(255,255,255,0.7);
    padding: 5px 14px;
    border-radius: 2px;
    font-family: 'Jost', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .logout-btn:hover { border-color: rgba(255,255,255,0.6); color: white; }

  /* ===== GRID ===== */
  .cards-grid {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  /* ===== CARD ===== */
  .card {
    background: white;
    border: 1px solid rgba(184,151,74,0.18);
    border-radius: 3px;
    box-shadow: 0 2px 16px var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.25s, transform 0.25s;
  }
  .card:hover { box-shadow: 0 6px 30px var(--shadow-md); transform: translateY(-2px); }

  .card-header {
    background: linear-gradient(135deg, var(--olive-dark) 0%, var(--olive) 100%);
    padding: 20px 22px 18px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .card-header-left { flex: 1; }

  .card-category {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-light);
    font-weight: 500;
    margin-bottom: 5px;
    opacity: 0.85;
  }

  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-weight: 500;
    color: white;
    line-height: 1.3;
    letter-spacing: 0.02em;
  }

  .card-toggle {
    width: 22px; height: 22px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
    transition: transform 0.3s, background 0.2s;
  }
  .card-toggle svg { width: 10px; height: 10px; fill: none; stroke: rgba(255,255,255,0.7); stroke-width: 2; }
  .card.open .card-toggle { transform: rotate(180deg); background: rgba(255,255,255,0.12); }

  .card-body {
    display: none;
    padding: 22px;
    flex: 1;
    flex-direction: column;
  }
  .card.open .card-body { display: flex; flex-direction: column; }

  /* ===== CONTENT BLOCKS ===== */
  .info-intro {
    font-size: 0.9rem;
    color: var(--text-light);
    line-height: 1.75;
    margin-bottom: 18px;
    font-style: italic;
  }

  .section-label {
    font-size: 0.65rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--gold);
    margin: 18px 0 8px;
  }
  .section-label:first-child { margin-top: 0; }

  /* Alert boxes */
  .alert { border-radius: 2px; padding: 12px 15px; margin: 12px 0; font-size: 0.83rem; line-height: 1.6; }
  .alert-warning { background: var(--alert-bg); border-left: 3px solid var(--alert-border); color: #7a5c1e; }
  .alert-danger { background: var(--danger-bg); border-left: 3px solid var(--danger-border); color: #7a2222; }
  .alert-tip { background: var(--tip-bg); border-left: 3px solid var(--tip-border); color: #3a4a30; }
  .alert strong { font-weight: 500; display: block; margin-bottom: 4px; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; }

  /* Simple list */
  .simple-list { list-style: none; margin: 0; padding: 0; }
  .simple-list li {
    padding: 5px 0 5px 16px;
    position: relative;
    font-size: 0.86rem;
    color: var(--text);
    line-height: 1.55;
    border-bottom: 1px solid rgba(184,151,74,0.08);
  }
  .simple-list li:last-child { border-bottom: none; }
  .simple-list li::before { content: "–"; position: absolute; left: 0; color: var(--gold); font-weight: 400; }

  /* ===== ACCORDIONS ===== */
  .accordion {
    border: 1px solid rgba(184,151,74,0.2);
    border-radius: 2px;
    margin: 8px 0;
    overflow: hidden;
  }

  .accordion-trigger {
    width: 100%;
    background: none;
    border: none;
    padding: 12px 14px;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Jost', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--olive);
    letter-spacing: 0.06em;
    background: rgba(184,151,74,0.04);
    transition: background 0.2s;
    gap: 8px;
  }
  .accordion-trigger:hover { background: rgba(184,151,74,0.09); }

  .accordion-trigger .acc-icon {
    width: 16px; height: 16px; flex-shrink: 0;
    border: 1px solid rgba(74,82,64,0.25);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s;
  }
  .accordion-trigger .acc-icon svg { width: 7px; height: 7px; fill: none; stroke: var(--olive-light); stroke-width: 2; }
  .accordion-trigger.open .acc-icon { transform: rotate(180deg); }

  .accordion-content {
    display: none;
    padding: 14px 16px;
    border-top: 1px solid rgba(184,151,74,0.15);
    background: white;
  }
  .accordion-content.open { display: block; }

  /* ===== CHECKLISTS ===== */
  .checklist { list-style: none; margin: 0; padding: 0; }
  .checklist-subcategory {
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--olive-light);
    margin: 12px 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid rgba(184,151,74,0.15);
  }
  .checklist-subcategory:first-child { margin-top: 0; }

  .checklist li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 5px 0;
    font-size: 0.84rem;
    color: var(--text);
    line-height: 1.5;
    cursor: pointer;
    transition: color 0.15s;
  }
  .checklist li:hover { color: var(--olive); }

  .checklist li input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 15px; height: 15px;
    border: 1.5px solid rgba(184,151,74,0.5);
    border-radius: 1px;
    flex-shrink: 0;
    margin-top: 2px;
    cursor: pointer;
    position: relative;
    transition: all 0.15s;
    background: white;
  }
  .checklist li input[type="checkbox"]:checked {
    background: var(--olive);
    border-color: var(--olive);
  }
  .checklist li input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 3px; top: 1px;
    width: 5px; height: 8px;
    border: 1.5px solid white;
    border-top: none; border-left: none;
    transform: rotate(45deg);
  }
  .checklist li.checked span { text-decoration: line-through; color: #bbb; }

  /* ===== TWO-COL TABLE ===== */
  .compare-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 8px 0; }
  .compare-table th {
    background: var(--olive);
    color: white;
    padding: 8px 12px;
    text-align: left;
    font-weight: 500;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
  }
  .compare-table td { padding: 8px 12px; border-bottom: 1px solid rgba(184,151,74,0.12); vertical-align: top; }
  .compare-table tr:last-child td { border-bottom: none; }
  .compare-table tr:nth-child(even) td { background: rgba(184,151,74,0.04); }

  /* ===== SPECIAL WARNING BOX ===== */
  .warning-box {
    background: var(--cream);
    border: 1px solid rgba(184,151,74,0.3);
    border-radius: 2px;
    padding: 14px 16px;
    margin: 12px 0;
  }
  .warning-box .wb-title {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--gold);
    margin-bottom: 8px;
  }
  .warning-box ul { list-style: none; padding: 0; margin: 0; }
  .warning-box ul li {
    padding: 3px 0 3px 14px;
    position: relative;
    font-size: 0.83rem;
    color: var(--text-light);
    line-height: 1.5;
  }
  .warning-box ul li::before { content: "×"; position: absolute; left: 0; color: var(--danger-border); font-weight: 700; }

  /* ===== CTA ===== */
  .card-cta {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid rgba(184,151,74,0.15);
    margin-top: 20px;
  }
  .cta-btn {
    display: block;
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    color: white;
    text-decoration: none;
    text-align: center;
    font-family: 'Jost', sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border-radius: 2px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .cta-btn:hover { opacity: 0.9; }
  .cta-btn:active { transform: scale(0.99); }

  /* ===== SCREEN PROTECTION OVERLAY ===== */
  #protect-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 99999;
    background: var(--olive-dark);
    align-items: center; justify-content: center;
    flex-direction: column;
    gap: 16px;
    color: white;
    font-family: 'Jost', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  #protect-overlay svg { width: 40px; height: 40px; opacity: 0.4; }

  /* ===== SVG DECO ===== */
  .hero-deco svg { position: absolute; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    .cards-grid { padding: 24px 12px 60px; gap: 14px; }
    .card-body { padding: 16px; }
    .login-card { padding: 36px 24px; }
    .hero-logo { width: 200px; }
  }

  /* blur on screenshot attempt */
  .blur-protect { user-select: none; }
</style>
</head>

<script>
// ===== AUTH =====
const PASSWORDS = ['acc2025', 'central123', 'casamento'];

function doLogin() {
  const pwd = document.getElementById('pwd-input').value;
  const err = document.getElementById('login-error');
  if (PASSWORDS.includes(pwd)) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    sessionStorage.setItem('acc_auth', '1');
    err.textContent = '';
  } else {
    err.textContent = 'Senha incorreta. Tente novamente.';
    document.getElementById('pwd-input').value = '';
  }
}

function doLogout() {
  sessionStorage.removeItem('acc_auth');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pwd-input').value = '';
}

document.getElementById('pwd-input').addEventListener('keypress', e => {
  if (e.key === 'Enter') doLogin();
});

if (sessionStorage.getItem('acc_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

// ===== SCREEN PROTECTION =====
document.addEventListener('keydown', e => {
  if ((e.key === 'PrintScreen') || (e.ctrlKey && e.shiftKey && (e.key === 'S' || e.key === 's')) || (e.metaKey && e.shiftKey)) {
    e.preventDefault();
    const o = document.getElementById('protect-overlay');
    o.style.display = 'flex';
    setTimeout(() => o.style.display = 'none', 2000);
  }
});

window.addEventListener('blur', () => {
  document.body.style.filter = 'blur(8px)';
});
window.addEventListener('focus', () => {
  document.body.style.filter = '';
});

// ===== CARD TOGGLE =====
function toggleCard(card) {
  card.classList.toggle('open');
}

function toggleAccordion(btn) {
  btn.classList.toggle('open');
  const content = btn.nextElementSibling;
  content.classList.toggle('open');
}

// ===== CHECKLIST =====
function toggleCheck(li) {
  const cb = li.querySelector('input[type="checkbox"]');
  cb.checked = !cb.checked;
  if (cb.checked) li.classList.add('checked'); else li.classList.remove('checked');
}

// ===== CARD DATA =====
const CTA_LINK = "https://silvanasantana.my.canva.site/a-central-do-casamento/";

function makeChecklist(items, subcat) {
  if (subcat) {
    return `<div class="checklist-subcategory">${subcat}</div>` + makeChecklist(items);
  }
  return `<ul class="checklist">${items.map(i => `<li onclick="toggleCheck(this)"><input type="checkbox"><span>${i}</span></li>`).join('')}</ul>`;
}

function makeAccordion(title, content) {
  return `<div class="accordion">
    <button class="accordion-trigger" onclick="toggleAccordion(this)">
      <span>${title}</span>
      <span class="acc-icon"><svg viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
    <div class="accordion-content">${content}</div>
  </div>`;
}

function makeList(items) {
  return `<ul class="simple-list">${items.map(i => `<li>${i}</li>`).join('')}</ul>`;
}

function makeAlert(type, title, content) {
  return `<div class="alert alert-${type}"><strong>${title}</strong>${content}</div>`;
}

function makeWarningBox(title, items) {
  return `<div class="warning-box"><div class="wb-title">${title}</div><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`;
}

function makeCTA() {
  return `<div class="card-cta"><a href="${CTA_LINK}" target="_blank" class="cta-btn">Não esqueça disso aqui</a></div>`;
}

function makeLabel(text) {
  return `<div class="section-label">${text}</div>`;
}

// ===== CARDS =====
const cards = [
  // 1. POR ONDE COMEÇAR
  {
    title: "Por Onde Começar",
    category: "Planejamento",
    body: `
      ${makeLabel("Primeiros passos")}
      <p class="info-intro">Antes de contratar fornecedores, organizem as informações principais do casamento. Isso evita decisões impulsivas, contratos errados e gastos desnecessários.</p>

      ${makeAlert('warning', 'Atenção', 'Receber orçamento NÃO reserva a data. Fornecedores podem fechar com outro casal antes da sua decisão.')}

      `)}

      ${makeLabel("Ordem de pesquisa recomendada")}

      ${makeCTA()}
    `
  },
  // 2. O QUE É CERIMONIAL

    title: "O Que É Cerimonial, na Prática?",
    category: "Cerimonial & Organização",
    body: `
      ${makeLabel("Entendendo as diferenças")}
      <table class="compare-table">
        <tr><th>Profissional</th><th>Função Principal</th></tr>
        <tr><td><strong>Cerimonialista</strong></td><td>Organiza, coordena e resolve — bastidores do evento</td></tr>

        <tr><td><strong>Mestre de Cerimônias</strong></td><td>Apresenta e anuncia momentos do evento</td></tr>
      </table>

      ${makeAlert('warning', 'Muita gente confunde', 'Ter alguém recepcionando convidados NÃO significa ter um cerimonial completo. O verdadeiro cerimonial vai muito além da recepção.')}

      ${makeAccordion('O que a Cerimonialista faz', `

// ===== RENDER CARDS =====
function renderCards() {
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = '';
  cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="card-header" onclick="toggleCard(this.parentElement)">
        <div class="card-header-left">
          <div class="card-category">${card.category}</div>
          <div class="card-title">${card.title}</div>
        </div>
        <div class="card-toggle">
          <svg viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="card-body">${card.body}</div>
    `;
    grid.appendChild(el);
  });
}

renderCards();
